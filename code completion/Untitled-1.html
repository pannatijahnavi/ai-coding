<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Visitor Counter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6ff;
            text-align: center;
            margin: 0;
            padding: 50px;
        }

        .container {
            width: 350px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
        }

        .count {
            font-size: 70px;
            font-weight: bold;
            margin: 25px;
            color: #2563eb;
        }

        button {
            padding: 12px 25px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .enter {
            background: #22c55e;
            color: white;
        }

        .exit {
            background: #ef4444;
            color: white;
        }

        .reset {
            background: #555;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Smart Visitor Counter</h1>

        <p>Current Visitors</p>

        <div class="count" id="visitorCount">0</div>

        <button class="enter" onclick="enterVisitor()">
            Visitor Enter
        </button>

        <button class="exit" onclick="exitVisitor()">
            Visitor Exit
        </button>

        <br>

        <button class="reset" onclick="resetCounter()">
            Reset
        </button>

        <p id="status">Room is Empty</p>

    </div>

    <script>

        let count = 0;

        function updateDisplay() {

            document.getElementById("visitorCount").innerText = count;

            if (count === 0) {
                document.getElementById("status").innerText =
                    "Room is Empty";
            } else {
                document.getElementById("status").innerText =
                    count + " visitor(s) inside";
            }
        }

        function enterVisitor() {
            count++;
            updateDisplay();
        }

        function exitVisitor() {

            if (count > 0) {
                count--;
            }

            updateDisplay();
        }

        function resetCounter() {
            count = 0;
            updateDisplay();
        }

    </script>

</body>
</html>
